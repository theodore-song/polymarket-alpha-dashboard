name: PolyAlpha continuous five-minute paper cycle

on:
  schedule:
    # Best-effort watchdog only. Successful runs dispatch their own successor,
    # avoiding GitHub's heavily delayed high-frequency scheduled-event queue.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # An authenticated outside-news monitor can request an immediate cycle without
  # waiting for the next scheduled poll. The cycle still applies every v2.4 gate.
  repository_dispatch:
    types: [news_alert]

permissions:
  contents: write
  actions: write

concurrency:
  group: polyalpha-paper-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Record the cadence anchor
        run: echo "CHAIN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore the authoritative runtime ledger
        id: restore
        shell: bash
        run: |
          mkdir -p work/runtime
          if git fetch origin runtime-state:refs/remotes/origin/runtime-state; then
            git show origin/runtime-state:runtime/polyalpha-v2.sqlite3 > work/polyalpha-v2.sqlite3
            for dataset in dashboard trades equity health; do
              git show "origin/runtime-state:runtime/${dataset}.json" > "work/runtime/${dataset}.json"
            done
            echo "had_runtime=true" >> "$GITHUB_OUTPUT"
          else
            PYTHONPATH=engine/src python scripts/import_snapshot.py \
              --snapshot public/data/snapshot.json \
              --db work/polyalpha-v2.sqlite3
            echo "had_runtime=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute one complete public-data cycle
        id: trade
        shell: bash
        run: |
          set +e
          PYTHONPATH=engine/src python scripts/run_runtime_cycle.py \
            --db work/polyalpha-v2.sqlite3 \
            --output-dir work/runtime \
            --manifest engine/agents.json
          result=$?
          set -e
          echo "exit_code=${result}" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 0 ]; then
            cp work/polyalpha-v2.sqlite3 work/runtime/polyalpha-v2.sqlite3
          fi

      - name: Verify the completed runtime
        if: steps.trade.outputs.exit_code == '0'
        run: PYTHONPATH=engine/src python scripts/verify_runtime.py --runtime work/runtime

      - name: Publish one atomic runtime-state commit
        if: steps.trade.outputs.exit_code == '0' || steps.restore.outputs.had_runtime == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/runtime-state; then
            runtime_sha=$(git rev-parse refs/remotes/origin/runtime-state)
            git switch --detach refs/remotes/origin/runtime-state
            mkdir -p runtime
            cp work/runtime/dashboard.json runtime/dashboard.json
            cp work/runtime/trades.json runtime/trades.json
            cp work/runtime/equity.json runtime/equity.json
            cp work/runtime/health.json runtime/health.json
            cp work/runtime/polyalpha-v2.sqlite3 runtime/polyalpha-v2.sqlite3
            git add runtime
            git commit --amend -m "Update PolyAlpha runtime state"
            git push \
              --force-with-lease="refs/heads/runtime-state:${runtime_sha}" \
              origin HEAD:refs/heads/runtime-state
          else
            git switch --orphan runtime-publish
            git rm -rf .
            mkdir -p runtime
            cp work/runtime/dashboard.json runtime/dashboard.json
            cp work/runtime/trades.json runtime/trades.json
            cp work/runtime/equity.json runtime/equity.json
            cp work/runtime/health.json runtime/health.json
            cp work/runtime/polyalpha-v2.sqlite3 runtime/polyalpha-v2.sqlite3
            git add runtime
            git commit -m "Initialize PolyAlpha runtime state"
            git push origin HEAD:refs/heads/runtime-state
          fi

      - name: Surface a failed paper cycle
        if: steps.trade.outputs.exit_code != '0'
        run: exit 1

      - name: Dispatch the next five-minute cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          elapsed=$(($(date +%s) - CHAIN_STARTED_AT))
          delay=$((300 - elapsed))
          if [ "$delay" -gt 0 ]; then
            sleep "$delay"
          fi
          for attempt in 1 2 3; do
            if gh workflow run paper-cycle.yml --ref main --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
